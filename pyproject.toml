[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signature-zine"
version = "1.0.0"
description = "Lay out, tone-correct and print zines and book signatures"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pymupdf>=1.24",
    "pillow>=10",
    "numpy>=1.24",
]

[project.gui-scripts]
signature-zine = "sigzine.__main__:main"

[project.optional-dependencies]
# Only needed to build the double-clickable application.
package = ["pyinstaller>=6.6"]

[tool.setuptools]
packages = ["sigzine", "sigzine.core", "sigzine.ui"]

[tool.setuptools.package-data]
sigzine = ["resources/*"]
